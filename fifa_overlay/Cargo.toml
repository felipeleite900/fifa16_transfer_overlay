[package]
name = "fifa_overlay"
version = "0.1.0"
edition = "2021"

[lib]
name = "fifa_overlay"
crate-type = ["cdylib"]

[dependencies]
hudhook = { version = "0.9", features = ["dx11"] }
imgui = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
memchr = "2.7"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ProcessStatus",
]

[profile.release]
debug = true
